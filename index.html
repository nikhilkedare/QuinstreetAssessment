<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link type="text/css" rel="stylesheet" href="./css/styles.css" media="all" />
  <title>QuinStreet Interview Assessment</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./images/mordernizeLogo.svg" alt="Modernize Logo" />
        </div>
    </header>
    <div class="container">
        <div class="formBox">
            <div class="formHeading">
                <h1>Enter to win a 3rd generation Nest <br/> Learning Thermostat worth $249.</h1>
            </div>
            <form class="formWrapper" id="contactForm">
                <input type="text" id="name" placeholder="Name" required />
                <div class="formInnerFlex">
                    <input type="text" id="city" placeholder="City" />
                    <input type="text" id="state" placeholder="State" />
                </div>
                <input type="text" id="phone" placeholder="Phone Number" required />
                <input type="email" id="email" placeholder="Email Address" required />
                <button type="submit" id="submitBtn" class="submitBtn">Enter To Win</button>
            </form>
        </div>
        <div class="savingsWrapper">
            <h2>EVEN MORE SAVINGS </h2>
            <div class="advertorial">
                <h3>ADVERTORIAL</h3>
                <h2>Tricks Homeowners Use to Eliminate Bills</h2>
                <div class="ellipseWrap">
                    <p>Surging energy bills, unpredictable weather patterns and dissatisfaction with utility companies have homeowners scrambling lorem ipsum lorem ipsum</p>
                    <a class="readMore" href="https://google.com" target="_blank" rel="noopener noreferrer">Read more</a>
                </div>
            </div>
         </div>
    </div>

    <script type="text/javascript" src="./js/script.js"></script>
</body>
</html>
